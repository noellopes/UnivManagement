name: PR file limit

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  file-limit:
    name: PR file limit
    runs-on: ubuntu-latest

    steps:
      - name: Check changed file count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          files=$(gh api --paginate \
            "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[].filename')

          count=$(printf '%s\n' "$files" | awk 'NF { n++ } END { print n+0 }')

          echo "Changed files: $count (maximum 3)"

          if [ "$count" -gt 3 ]; then
            echo "::error::This PR changes $count files. Maximum allowed: 3."
            exit 1
          fi
